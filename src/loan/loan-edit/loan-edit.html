<div class="container">
    @if (id()) {
    <h1>Modificar préstamo</h1>
    } @else {
    <h1>Crear préstamo</h1>
    }

    <form>
        <mat-form-field>
            <mat-label>Identificador</mat-label>
            <input type="text" matInput placeholder="Identificador" [(ngModel)]="id" name="id" disabled>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Cliente</mat-label>
            <mat-select [(ngModel)]="clientId" name="clientId">
                @for (client of clients; track client.id) {
                    <mat-option [value]="client.id">
                        {{ client.name }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Juego</mat-label>
            <mat-select [(ngModel)]="gameId" name="gameId">
                @for (game of games; track game.id) {
                    <mat-option [value]="game.id">
                        {{ game.title }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Fecha de inicio</mat-label>
            <input
                matInput
                [matDatepicker]="startPicker"
                [ngModel]="startDate()"
                (ngModelChange)="startDate.set($event)"
                name="startDate">

            <mat-datepicker-toggle matIconSuffix [for]="startPicker">
            </mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Fecha de finalización</mat-label>
            <input
                matInput
                [matDatepicker]="endPicker"
                [ngModel]="endDate()"
                (ngModelChange)="endDate.set($event)"
                name="endDate">

            <mat-datepicker-toggle matIconSuffix [for]="endPicker">
            </mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>

    </form>

    <div class="buttons">
        <button mat-stroked-button (click)="onClose()">Cerrar</button>
        <button mat-flat-button color="primary" (click)="onSave()">Guardar</button>
    </div>
</div>
