<div class="container">
    @if (id()) {
        <h1>Modificar cliente</h1>
    } @else {
        <h1>Crear cliente</h1>
    }
    
    <form>
        <mat-form-field>
            <mat-label>Identificador</mat-label>
            <input type="text" matInput placeholder="Identificador" [(ngModel)]="id" name="id" disabled>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Nombre</mat-label>
            <input type="text" matInput placeholder="Nombre del cliente" [(ngModel)]="name" (ngModelChange)="onNameChange($event)" name="name" required>
            @if (!name()) {
            <mat-error>El nombre no puede estar vacío</mat-error>
            }
            @if (duplicatedName()) {
            <div class="error-message">
                El nombre ya existe
            </div>            }
        </mat-form-field>
    </form>

    <div class="buttons">
        <button mat-stroked-button (click)="onClose()">Cerrar</button>
        <button mat-flat-button color="primary" (click)="onSave()">Guardar</button>
    </div>
</div>
